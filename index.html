<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Intreaty</title>
  <meta name="description" content="A simple, private prayer list.">
  <meta name="theme-color" content="#f4efe7">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Intreaty">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    // Apply the saved light/dark choice before anything draws, so there's no flash.
    try {
      var t = localStorage.getItem('intreaty.theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Intreaty</span>
      </div>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch theme"></button>
    </header>

    <main id="main" class="main">
      <section id="view-list" class="view" aria-labelledby="view-title">
        <div class="view-head">
          <p class="eyebrow" id="today-line"></p>
          <h1 id="view-title" class="view-title">Prayer Requests</h1>
          <div class="sub-row">
            <p id="view-sub" class="view-sub"></p>
            <button id="sort-btn" class="sort-btn" type="button" aria-pressed="false" hidden></button>
          </div>
        </div>
        <div id="status-tabs" class="segmented" role="tablist" aria-label="Request status"></div>
        <div id="category-chips" class="chips" role="group" aria-label="Filter by category"></div>
        <ul id="entry-list" class="cards"></ul>
        <div id="empty-state" class="empty" hidden></div>
      </section>

      <section id="view-settings" class="view" aria-labelledby="settings-title" hidden></section>
    </main>

    <button id="add-btn" class="fab" type="button" aria-label="Add"></button>

    <nav class="tabbar" aria-label="Sections">
      <a href="#/requests" data-tab="requests" class="tab"><span class="tab-icon" data-icon="flame"></span><span>Requests</span></a>
      <a href="#/thanks" data-tab="thanks" class="tab"><span class="tab-icon" data-icon="heart"></span><span>Thanksgivings</span></a>
      <a href="#/settings" data-tab="settings" class="tab"><span class="tab-icon" data-icon="sliders"></span><span>Settings</span></a>
    </nav>
  </div>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"><div class="sheet-inner" id="sheet-inner"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <noscript><p class="noscript">Intreaty needs JavaScript turned on.</p></noscript>
</body>
</html>
